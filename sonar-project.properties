# ตั้งค่าการตรวจคุณภาพโค้ดด้วย SonarQube (วิธีใช้ดู sonar/README.md)
sonar.projectKey=pos-stock-moo-kratha
sonar.projectName=POS & Stock - บ้านน้องโฟค หมูกระทะ
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# โค้ดที่ตรวจ: backend (Node.js / Express) + frontend (React)
sonar.sources=backend/src,backend/scripts,backend/db,frontend/src,frontend/index.html
sonar.tests=backend/tests

# ไม่ต้องตรวจ: ไลบรารี ผลลัพธ์ build รูปภาพ ไฟล์สำรอง
sonar.exclusions=**/node_modules/**,**/dist/**,**/media/**,**/backups/**,**/*.png,**/*.jpg

# token / ที่อยู่ server ไม่เขียนไว้ที่นี่ (ไฟล์นี้ขึ้น GitHub) — ส่งผ่านตัวแปร SONAR_TOKEN / SONAR_HOST_URL ตอนรัน

# api.test.mjs เป็นสคริปต์ทดสอบ API แบบเขียนเอง (ไม่ได้ใช้ test()/it() ของเฟรมเวิร์ก)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/tests/api.test.mjs
# ตัวอักษรสีขาวบนพื้นโปร่งแสงที่ซ้อนบนแถบสีถ่าน/สีแดงเข้ม: ตัวตรวจคิดว่าพื้นเป็นสีขาว จึงแจ้ง contrast ผิด
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/src/styles.css

# coverage ของ backend จากชุดทดสอบ API: cd backend && npm run test:coverage (ใช้ฐานข้อมูลทดสอบ)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# หน้าจอ React และสคริปต์ผู้ดูแล (backup/restore/migrate/demo) ยังไม่มีชุดทดสอบอัตโนมัติ
# จึงไม่นับเข้าเกณฑ์ coverage — แต่ยังตรวจ bug / vulnerability / code smell ตามปกติ
sonar.coverage.exclusions=frontend/**,backend/scripts/**,backend/tests/**
